spring:
  application:
    name: contabilidad
  config:
    # Permite leer las variables desde el archivo .env de la raíz del proyecto (desarrollo local).
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:contabilidad}
    username: ${DB_USER:contabilidad}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Lima

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,text/csv
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: CONTABILIDAD_SESION
        http-only: true
        same-site: strict
        secure: ${APP_COOKIE_SEGURA:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  aplicacion:
    nombre: CONTABILIDAD
    descripcion: Sistema de gestión del Plan Contable General Empresarial del Perú

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

app:
  cors-origenes: ${APP_CORS_ORIGENES:http://localhost:5173}
  login:
    intentos-maximos: 5
    bloqueo-minutos: 15
  admin-inicial:
    usuario: ${APP_ADMIN_USUARIO:}
    nombre: ${APP_ADMIN_NOMBRE:Administrador del sistema}
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
